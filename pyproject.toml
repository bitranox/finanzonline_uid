[project]
name = "finanzonline_uid"
version = "2.7.14"
description = "Python library and CLI for querying Level 2 UID checks via FinanzOnline Austria"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "rich-click>=1.9.9",
    "lib_cli_exit_tools>=2.4.1",
    "lib_log_rich>=8.1.2",
    "lib_layered_config>=7.5.0",
    # 1.5.0 exposes the `transport` delivery seam that send_email forwards.
    "btx_lib_mail>=4.6.0",
    "pydantic>=2.14.1",
    "zeep>=4.3.3",
    "filelock>=4.1.0",
    "orjson>=3.13.0",
]
license = { text = "MIT" }
authors = [{ name = "bitranox", email = "bitranox@gmail.com" }]
keywords = ["uid", "vat", "austria", "finanzonline", "tax", "verification", "cli"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "License :: OSI Approved :: MIT License",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Typing :: Typed",
]

# System packages required for CI runners (read by GitHub Actions workflow template)
# Format: "apt_package_name" for Ubuntu, future: {"apt": "...", "brew": "...", "choco": "..."}
[tool.ci]
system-dependencies-ubuntu = []
system-dependencies-macos = []
system-dependencies-windows-pip = []
system-dependencies-windows-choco = []
os = ["ubuntu-latest", "windows-latest", "macos-latest"]

[project.urls]
Homepage = "https://github.com/bitranox/finanzonline_uid"
Repository = "https://github.com/bitranox/finanzonline_uid.git"
Issues = "https://github.com/bitranox/finanzonline_uid/issues"

[project.optional-dependencies]
dev = [
  "pytest>=9.2.0",
  "pytest-cov>=7.1.0",
  "pytest-xdist>=3.8.0",
  "ruff>=0.17.3",
  "pyright[nodejs]>=1.1.414",
  "bandit>=1.9.4",
  "build>=1.6.1",
  "hatchling>=1.33.0",
  "twine>=7.0.0",
  # codecov-cli is disabled, not dropped: it requires click<8.3.0, which drags click back to
  # 8.2.1 - the version with CVE-2026-7246 (command injection in click.edit(), fixed in 8.3.3).
  # Nothing else here caps click, so with this line active the audit gate goes red on every
  # clean install. Leaving it off costs nothing: CI uploads coverage via codecov/codecov-action,
  # not this CLI, and "bmk codecov" resolves codecovcli from PATH and only warns when absent.
  # Re-enable once codecov-cli relaxes its click<8.3.0 pin.
  # "codecov-cli>=11.2.8",
  # Transitive CVE pins
  "click>=8.5.0",                # CVE-2026-7246
  "certifi>=2026.10.23",         # PYSEC-2026-4320
  "pip-audit>=2.10.1",
  "textual>=8.2.8",
  "import-linter>=2.15",
  "rtoml>=0.14.0",
]

[project.scripts]
finanzonline_uid = "finanzonline_uid.cli:main"
finanzonline-uid = "finanzonline_uid.cli:main"

[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"



[tool.hatch.build.targets.wheel]
packages = ["src/finanzonline_uid"]
include = [
  "src/finanzonline_uid/py.typed",
  "src/finanzonline_uid/defaultconfig.toml",
  "src/finanzonline_uid/defaultconfig.d/*.toml",
  "src/finanzonline_uid/locales/**/*.mo",
]

# An allowlist, never a denylist: hatchling reads only the root .gitignore, so tracked working
# files and files hidden through .git/info/exclude or a nested .gitignore (session records,
# review notes, helper scripts) would ship. tests/test_packaging.py builds the sdist and
# refuses any other top-level entry.
[tool.hatch.build.targets.sdist]
include = [
    "/src/finanzonline_uid",
    "/tests",
    "/docs",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/pyproject.toml",
]

[tool.ruff]
line-length = 160
target-version = "py310"

[tool.ruff.lint]
# Added on top of ruff's default rule set (this repo has no explicit select).
extend-select = [
  "C90",         # mccabe: cyclomatic complexity <= 10 (the house hard limit)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# ignore the "unused import sys" in the jupyter notebook - which we need (it is a linter hickup)
# A `!cmd` never raises, so CI sees a failing shell command only through
# `assert _exit_code == N` after it: IPython injects `_exit_code` at run time (F821)
# and those asserts are the gate (S101).
"notebooks/*.ipynb" = ["F401", "F821", "S101"]

[tool.pyright]
typeCheckingMode = "strict"
extraPaths = [
  "src",
  "tests",
]
exclude = [
  "scripts/menu.py",
  # zeep SOAP library has no type stubs, causing many reportUnknownMemberType errors
  "src/finanzonline_uid/adapters/finanzonline/session_client.py",
  "src/finanzonline_uid/adapters/finanzonline/uid_query_client.py",
  ".venv*",
]
executionEnvironments = [{root = "tests"}]

[tool.pytest.ini_options]
addopts = ["--doctest-modules"]
doctest_optionflags = ["ELLIPSIS", "NORMALIZE_WHITESPACE"]
pythonpath = ["src", "tests"]
markers = [
  "os_agnostic: test runs on every supported operating system",
  "os_windows: test exercises Windows-only behavior",
  "os_macos: test exercises macOS-only behavior",
  "os_posix: test exercises behavior requiring POSIX semantics",
  "os_linux: test exercises Linux-only behavior",
]
testpaths = ["src", "tests"]

[tool.coverage.run]
branch = true
parallel = false
data_file = ".coverage.unit"
source = ["src/finanzonline_uid"]

[tool.coverage.report]
omit = [
  "tests/*",
]
fail_under = 85
show_missing = true

[tool.coverage.json]
output = "coverage.json"
pretty_print = true

[tool.clean]
# Patterns to remove when running `make clean`
patterns = [
  "**/__pycache__",
  ".hypothesis",
  ".import_linter_cache",
  ".pytest_cache",
  ".ruff_cache",
  ".pyright",
  ".mypy_cache",
  ".tox",
  ".nox",
  ".eggs",
  "*.egg-info",
  "build",
  "dist",
  "htmlcov",
  ".coverage",
  "coverage.xml",
  "codecov.sh",
  ".cache",
  "result",
]

[tool.git]
# Default git remote for push/release commands
default-remote = "origin"


[tool.scripts.test]
# Configuration for scripts/test.py test runner
pytest-verbosity = "-vv"
coverage-report-file = "coverage.xml"
src-path = "src"
[tool.importlinter]
root_package = "finanzonline_uid"

[[tool.importlinter.contracts]]
name = "CLI depends on behaviors only"
type = "layers"
layers = [
  "finanzonline_uid.cli",
  "finanzonline_uid.behaviors",
]

[tool.psscriptanalyzer]
# PSScriptAnalyzer rules to exclude when linting .ps1 files
# PSAvoidUsingInvokeExpression / PSAvoidUsingCmdletAliases: standard uv install
# uses `irm ... | iex` per upstream docs (https://astral.sh/uv/install.ps1)
exclude-rules = [
  "PSAvoidUsingWriteHost",
  "PSUseBOMForUnicodeEncodedFile",
  "PSUseUsingScopeModifierInNewRunspaces",
  "PSAvoidUsingInvokeExpression",
  "PSAvoidUsingCmdletAliases",
]

[tool.pip-audit]
# Known vulnerabilities to ignore (unfixable or accepted risk)
# PYSEC-2022-42969: py library ReDoS (no fix available, low risk)
# CVE-2026-3219: pip 26.0.1 concatenated tar/ZIP confusion (no fix available yet, CI-only)
ignore-vulns = ["PYSEC-2022-42969", "CVE-2026-3219"]

[tool.uv]
exclude-newer = "7 days"
exclude-newer-package = {btx-lib-mail = false, lib-cli-exit-tools = false, lib-layered-config = false, lib-log-rich = false, certifi = "2026-10-23T11:36:17Z", hatchling = "2026-10-28T02:27:31Z", pytest = "2026-10-27T21:30:21Z", ruff = "2026-10-27T00:34:06Z"}
